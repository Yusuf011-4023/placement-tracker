spring:
  application:
    name: placement-tracker
  task:
    scheduling:
      pool:
        size: 2 # the sync and the reminders each get a thread, so a long sync never delays a reminder
logging:
  file:
    # same folder as the database (DataDir): tracker.data-dir if set, else %LOCALAPPDATA%\PlacementTracker
    name: ${tracker.data-dir:${LOCALAPPDATA:${user.home}/AppData/Local}/PlacementTracker}/logs/tracker.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 14
      total-size-cap: 100MB
server:
  address: 127.0.0.1
  port: 8765
tracker:
  sync:
    interval-minutes: 20
    backfill-from: 2026-06-01T00:00:00Z
  gmail:
    max-requests-per-second: 10 # about 3,000 of Gmail's 6,000 quota units per minute (messages.get costs 5)
    max-messages-per-run: 500 # full bodies fetched per batch, oldest first
    fetch-threads: 4 # bodies fetched at once; the throttle still caps the total rate. Raise only if the log shows no back-off
  ai:
    model: claude-haiku-5-5
    confidence-threshold: 0.7
    max-attempts: 3
  prefilter:
    keywords:
      - application*
      - applied
      - apply
      - applying
      - placement*
      - internship*
      - intern
      - interns
      - industrial
      - year in industry
      - assessment*
      - online test
      - online tests
      - test invitation
      - interview*
      - assessment centre
      - candidate*
      - offer
      - offered
      - recruit*
      - talent
      - hiring
      - career*
      - vacancy
      - vacancies
      - position
      - positions
      - role
      - roles
      - shortlist*
      - next steps
      - unfortunately
      - thank you for your interest
      - invitation*
    ats-domains:
      - myworkday.com
      - workday.com
      - successfactors.com
      - successfactors.eu
      - oraclecloud.com
      - taleo.net
      - greenhouse.io
      - lever.co
      - smartrecruiters.com
      - icims.com
      - hirevue.com
      - tal.net
      - eightfold.ai
      - avature.net
      - brightnetwork.co.uk
      - gradcracker.com
      - ratemyplacement.co.uk
      - higherin.com
      - linkedin.com
      - indeed.com
      - targetjobs.co.uk
      - prospects.ac.uk
    extra-domains: []
    # job alerts and newsletters, never applications; personal additions go in blocked-senders.txt in the data folder
    blocked-senders:
      - jobalerts-noreply@linkedin.com
      - newsletters-noreply@linkedin.com
      - invitations@linkedin.com
      - updates-noreply@linkedin.com
      - em.linkedin.com
      - jobalert.indeed.com
      - match.indeed.com
