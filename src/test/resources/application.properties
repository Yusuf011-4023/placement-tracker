tracker.sync.scheduler-enabled=false
tracker.tray.enabled=false
tracker.reminders.enabled=false
# Every test context gets a throwaway data dir; no test may touch the owner's real %LOCALAPPDATA%\PlacementTracker.
tracker.data-dir=${java.io.tmpdir}/placement-tracker-test-${random.uuid}
# No log file from tests (the console is enough).
logging.file.name=
